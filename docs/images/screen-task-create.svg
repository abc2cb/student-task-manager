  <text x="280" y="719" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="16" font-weight="700">Зберегти</text>
  <text x="24" y="818" fill="#8192A3" font-family="Arial" font-size="12">Ескіз 2 · форма створення</text>
