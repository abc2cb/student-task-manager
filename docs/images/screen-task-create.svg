<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Ескіз екрана створення завдання</title>
  <desc id="desc">Мобільна форма додавання навчального завдання з кнопками скасування та збереження.</desc>
  <rect width="390" height="844" fill="#F7F9FC"/>
  <rect x="0" y="0" width="390" height="88" fill="#17324D"/>
  <text x="24" y="39" fill="#FFFFFF" font-family="Arial" font-size="21" font-weight="700">Нове завдання</text>
  <text x="24" y="66" fill="#D9E8F4" font-family="Arial" font-size="14">Крок 2 · заповнення форми</text>
  <text x="24" y="132" fill="#17324D" font-family="Arial" font-size="23" font-weight="700">Додати завдання</text>
  <text x="24" y="175" fill="#425466" font-family="Arial" font-size="14">Назва завдання</text>
  <rect x="24" y="188" width="342" height="52" rx="10" fill="#FFFFFF" stroke="#2A6F97"/>
  <text x="42" y="220" fill="#17324D" font-family="Arial" font-size="16">Підготувати прототип</text>
  <text x="24" y="278" fill="#425466" font-family="Arial" font-size="14">Дисципліна</text>
  <rect x="24" y="291" width="342" height="52" rx="10" fill="#FFFFFF" stroke="#C8D5E2"/>
  <text x="42" y="323" fill="#17324D" font-family="Arial" font-size="16">Технологія створення продуктів</text>
  <text x="24" y="381" fill="#425466" font-family="Arial" font-size="14">Дедлайн</text>
  <rect x="24" y="394" width="162" height="52" rx="10" fill="#FFFFFF" stroke="#C8D5E2"/>
  <text x="42" y="426" fill="#17324D" font-family="Arial" font-size="16">31.10.2026</text>
  <text x="210" y="381" fill="#425466" font-family="Arial" font-size="14">Пріоритет</text>
  <rect x="210" y="394" width="156" height="52" rx="10" fill="#FFFFFF" stroke="#C8D5E2"/>
  <text x="228" y="426" fill="#17324D" font-family="Arial" font-size="16">Середній</text>
