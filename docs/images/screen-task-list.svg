<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-labelledby="title desc">
  <title id="title">Ескіз екрана списку завдань</title>
  <desc id="desc">Мобільний екран Student Task Manager зі списком завдань і кнопкою додавання.</desc>
  <rect width="390" height="844" fill="#F7F9FC"/>
  <rect x="0" y="0" width="390" height="88" fill="#17324D"/>
  <text x="24" y="38" fill="#FFFFFF" font-family="Arial" font-size="21" font-weight="700">Student Task Manager</text>
  <text x="24" y="66" fill="#D9E8F4" font-family="Arial" font-size="14">Мої навчальні завдання</text>
  <text x="24" y="126" fill="#17324D" font-family="Arial" font-size="24" font-weight="700">Завдання</text>
  <rect x="24" y="148" width="342" height="48" rx="10" fill="#FFFFFF" stroke="#C8D5E2"/>
  <text x="42" y="178" fill="#425466" font-family="Arial" font-size="15">Усі дисципліни</text>
  <text x="338" y="178" fill="#2A6F97" font-family="Arial" font-size="18">⌄</text>
  <rect x="24" y="220" width="342" height="108" rx="14" fill="#FFFFFF" stroke="#C8D5E2"/>
  <circle cx="51" cy="250" r="10" fill="#F3B562"/>
  <text x="74" y="252" fill="#17324D" font-family="Arial" font-size="17" font-weight="700">Практична робота №13</text>
  <text x="74" y="278" fill="#5A6B7B" font-family="Arial" font-size="14">Технологія створення продуктів</text>
  <text x="74" y="305" fill="#A45A2A" font-family="Arial" font-size="13">Дедлайн: 31 жовтня</text>
  <rect x="24" y="346" width="342" height="108" rx="14" fill="#FFFFFF" stroke="#C8D5E2"/>
  <circle cx="51" cy="376" r="10" fill="#8BC6A8"/>
  <text x="74" y="378" fill="#17324D" font-family="Arial" font-size="17" font-weight="700">Підготувати прототип</text>
  <text x="74" y="404" fill="#5A6B7B" font-family="Arial" font-size="14">Проєкт Student Task Manager</text>
  <text x="74" y="431" fill="#3D7A58" font-family="Arial" font-size="13">Статус: у роботі</text>
  <rect x="24" y="482" width="342" height="52" rx="12" fill="#E9F2F8"/>
  <text x="42" y="514" fill="#2A6F97" font-family="Arial" font-size="15" font-weight="700">Показати виконані</text>
  <rect x="24" y="722" width="342" height="58" rx="16" fill="#2A6F97"/>
  <text x="195" y="758" text-anchor="middle" fill="#FFFFFF" font-family="Arial" font-size="17" font-weight="700">＋  Додати завдання</text>
  <text x="24" y="818" fill="#8192A3" font-family="Arial" font-size="12">Ескіз 1 · головний екран</text>
</svg>
